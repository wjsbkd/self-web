name: 部署站点

# 双目标部署：
#   1. Cloudflare Pages（主站）https://lizongheng-portfolio.pages.dev/
#      —— 需要 secret：CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID
#   2. GitHub Pages（备用）https://wjsbkd.github.io/
#      —— 需要 secret：PAGES_DEPLOY_KEY（SSH deploy key）
#
# 主站选 Cloudflare 的原因：本机实测 GitHub Pages 被分配到 japaneast（东京）节点，
# JS 4.0s / intro.mp4 45~92s / main.mp4 165~173s；Cloudflare 同机同网络为
# 2.4s / 12.1s / 27.1s。详见 HANDOVER 第九十二次。
#
# ⚠️ Cloudflare 那一路在 secret 配好前会失败并让整个 job 变红。
#    两种处理：配好 secret；或暂时把 deploy-cloudflare 的 `if` 条件改为只在
#    手动 dispatch 时跑（workflow_dispatch）。GitHub Pages 那一路不受影响。
on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'wrangler.toml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # 产物给两个 deploy job 共用
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  deploy-cloudflare:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # 主站。wrangler 在 CI 认这两个环境变量，不需要 wrangler login。
      # 若 job 报「Authentication error」= secret 未配或 token 缺 Pages 写权限。
      - name: 部署到 Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=lizongheng-portfolio --branch=main

  deploy-github-pages:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: 推送 dist/ 到 wjsbkd.github.io
        env:
          DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          cd dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b main
          git add -A
          git commit -q -m "部署 self-web · ${GITHUB_SHA}"
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -p 443 -o StrictHostKeyChecking=no -o ConnectTimeout=20"
          # 本机实测：只有 ssh.github.com:443 这条路径通，github.com:443 恒定超时
          git remote add origin ssh://git@ssh.github.com:443/wjsbkd/wjsbkd.github.io.git
          git push -f origin main
