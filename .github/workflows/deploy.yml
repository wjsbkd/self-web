name: 部署站点

# 双目标部署：
#   1. GitHub Pages（主站）https://wjsbkd.github.io/
#      —— 走 actions/deploy-pages，零 secret、零 SSH key。
#   2. Cloudflare Pages（备用）https://lizongheng-portfolio.pages.dev/
#      —— 需要两个 secret：CF_API_TOKEN（Cloudflare Pages 写权限）
#         + CLOUDFLARE_ACCOUNT_ID。名字在仓库 Settings 里创建时自己定，
#         创建后把下面 with: 里的字面量名换成你起的那个。
#
# 主站为什么是 GitHub Pages（2026-10-26 复核，推翻 HANDOVER 第九十二次的结论）：
# 早前只各采样一次，得到「Cloudflare 快 5–15 倍」并据此迁主站。后来做 8 轮中位数采样发现
# 节点分配变了：GitHub Pages 从 japaneast（东京）迁到 koreacentral（首尔 ICN），
# Cloudflare Anycast 落点一直是 SEA（西雅图）。同机同网络重测：
#   JS p50        GitHub 0.77s   vs Cloudflare 4.70s
#   intro.mp4     GitHub 2.0–3.1s vs Cloudflare 10.9–48.3s
#   main.mp4      GitHub 3.6–4.9s vs Cloudflare 38.3–57.9s
# 结论反过来了，所以域名元数据已全量回退到 wjsbkd.github.io。
#
# ⚠️ Cloudflare 那一路在 token 配好前只在 workflow_dispatch 时跑（见下面 job 的 if）。
#    配好 secret 后把那行 if 删掉，push 就会同时部署两个目标。
on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'wrangler.toml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # 产物给两个 deploy job 共用
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  deploy-github-pages:
    needs: build
    runs-on: ubuntu-latest
    # deploy-pages 需要这两个权限；仓库级 permissions 只给了 contents: read
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # 这一行会把仓库的 Pages 构建源从「分支 / 目录」切成「GitHub Actions」。
      # 切过去之后 wjsbkd.github.io 仓库 main 分支里那份旧 dist 就不再被构建，
      # 站点改由本 workflow 的 artifact 供源。想切回去：仓库 Settings → Pages
      # → Source 选 Deploy from a branch（main / root）。
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
        # 部署详情会出现在仓库 Environments → github-pages 里，含每次的 SHA

  # 备用站。token 配好前只在手动 dispatch 时跑，否则每推一次就把整个 run 拖红
  # （push 不触发它，GitHub Pages 那一路完全不受影响）。
  deploy-cloudflare:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # wrangler 在 CI 认这两个环境变量，不需要 wrangler login。
      # 若报「Authentication error」= secret 未配，或 token 缺 Pages 写权限
      # （Cloudflare 后台建 token 时权限要选 Account → Cloudflare Pages → Edit）。
      #
      # 这里必须写「字面量 secret 名」，不能把 secret 名再用一层表达式包起来：
      # 表达式里套表达式会让 GitHub 的解析器把整份 workflow 判成文件错误，
      # 连 job 都不建（实测 run 40213465063 就是这样，check-runs 为空）。
      # token 的 secret 名由你自己在仓库 Settings → Secrets and variables →
      # Actions 里创建时定，创建后把下面 CF_PAGES_TOKEN 换成你起的那个名字。
      - name: 部署到 Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_PAGES_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=lizongheng-portfolio --branch=main
