name: 线上冒烟测试

# 从 GitHub Actions 的网络（能到 api.sanity.io）验证部署后的站点，
# 用于绕开本机代理挡 api.sanity.io 的限制。手动触发。
#
# 验证三件事：
#   1. 主站 / /admin 都返回 200 且 HTML 引用的是预期 bundle
#   2. Sanity 数据 API 在带 Origin 头时返回 200 + CORS 头 + 真实数据
#      （证明真实访客的浏览器能读到数据，不只是本机 CDN 图能下）
#   3. Sanity CDN 图片返回 200 image/webp

on:
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    # 直接读仓库 Variables（不是 Secret），不用 gh CLI —— 少一层可能失败
    env:
      PROJECT_ID: ${{ vars.VITE_SANITY_PROJECT_ID }}
    steps:
      - name: 主站 / admin 可达 + bundle 哈希
        run: |
          set -e
          curl -fsS --max-time 30 "https://wjsbkd.github.io/" -o /tmp/idx.html
          grep -q '<title>李纵横' /tmp/idx.html
          idx_bundle=$(grep -o '/assets/main-[^"]*\.js' /tmp/idx.html | head -1)
          echo "主站 OK，bundle: $idx_bundle"

          curl -fsS --max-time 30 "https://wjsbkd.github.io/admin/" -o /tmp/adm.html
          grep -q 'studio-root' /tmp/adm.html
          adm_bundle=$(grep -o '/assets/admin-[^"]*\.js' /tmp/adm.html | head -1)
          echo "/admin OK，bundle: $adm_bundle"

          # robots 屏蔽 /admin
          curl -fsS --max-time 30 "https://wjsbkd.github.io/robots.txt" | grep -q 'Disallow: /admin'

      - name: Sanity 数据 API + CORS（模拟真实访客）
        run: |
          set -e
          API="https://${PROJECT_ID}.api.sanity.io/v2024-10-01/data/query/production"
          # 一条查询同时取标题与封面 asset ref：ref 存盘给下一步用，少一次请求。
          # 注意：image 字段里的 asset 是引用，必须用 asset._ref（asset._id 恒为 null）。
          QUERY='*[_type=="project" && status=="published"] | order(sortOrder asc) { title, "r": cover.image.asset._ref }'
          resp=$(curl -fsS --max-time 30 -D /tmp/hdrs.txt \
            -H "Origin: https://wjsbkd.github.io" \
            "${API}?query=$(python3 -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))' "$QUERY")")
          echo "$resp" > /tmp/projects.json
          echo "$resp" | python3 -c 'import json,sys;d=json.load(sys.stdin);ts=[r["title"] for r in d["result"]];assert len(ts)==3,ts;print("数据 API OK，3 篇作品：", ts)'
          grep -i 'access-control-allow-origin: https://wjsbkd.github.io' /tmp/hdrs.txt || \
            grep -i 'access-control-allow-origin: \*' /tmp/hdrs.txt
          echo "CORS 头确认"

      - name: Sanity CDN 图片
        run: |
          set -e
          ref=$(python3 -c 'import json;print(json.load(open("/tmp/projects.json"))["result"][0]["r"])')
          # ref 形如 image-<hash>-1280x720-jpg，CDN 路径要剥掉 image- 前缀
          url="https://cdn.sanity.io/images/${PROJECT_ID}/production/${ref#image-}?w=800&fm=webp&q=82"
          echo "图片 URL: $url"
          ct=$(curl -fsS --max-time 30 -o /dev/null -w '%{content_type}' "$url")
          echo "CDN 图 content-type: $ct"
          [ "$ct" = "image/webp" ]
