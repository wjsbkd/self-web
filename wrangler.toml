# Cloudflare Pages 配置
# 站点地址：https://lizongheng-portfolio.pages.dev/
#
# 部署方式：GitHub Actions（.github/workflows/deploy.yml）在 push 到 master 时
#   1. npm ci && npm run build
#   2. wrangler pages deploy dist --project-name=lizongheng-portfolio
#   3. 同时把 dist 推到 GitHub Pages（wjsbkd.github.io）作备用
#
# 认证：仓库 secret CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID
#   wrangler 在 CI 里认这两个环境变量，不需要 wrangler login。
#
# ⚠️ 本机已 wrangler login（账号 lzh3103875132@gmail.com，Account ID 857ebf14e5c227fb9256677b6d8718e8），
#   凭证在 C:\Users\lzh\.wrangler\config\default.toml —— 该目录不进库。
name = "lizongheng-portfolio"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-25"
