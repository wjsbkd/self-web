<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- theme-color 与页面最深档 --void-7 同值：手机浏览器的地址栏色应当是
         页面尽头的那个黑，不是改造前的暖炭 #0d0a0c -->
    <meta name="theme-color" content="#020202" />
    <style>
      /* 预绘制底色：CSS bundle 到位前先垫一层，避免首帧闪白 */
      html {
        background: #020202;
        color-scheme: dark;
      }
    </style>

    <!-- 首屏那张定妆照必须在这里就挂上：poster 是 React 挂载之后才写进 <video> 的，
         实测冷启动时它的请求要到 5.3s 才发出（页面 0.7–5s 才 FCP，取决于 CDN 那一枪多快），
         也就是「黑」的时长 ≈ 文档延迟 + poster 自己的 3.1s。preload 把它提到解析器扫到
         就发（≈0.26s），和 JS 并行，画面才可能赶在用户还没往下滚之前出现。 -->
    <link rel="preload" as="image" href="/assets/scrolly/intro-front.jpg" fetchpriority="high" />

    <!-- 字体：preconnect 提前握手（fonts.googleapis.cn 首次响应实测 2.58s，握手占其中一段），
         再用 <link rel="stylesheet"> 并行加载，不再走 global.css 里的 @import ——
         @import 排在 CSS bundle 顶部，浏览器要等整个 bundle 下载并解析后才发现它，
         再去取字体 CSS，首屏白等一整段串行链路。
         字重按全站 font-weight 实测清单收窄（Archivo 的 400/900 与 italic 600 全站 0 引用，
         DM Mono 只用 400/500 两档）。⚠️ 改字体族或字重时改这一行，别在 global.css 里加回 @import
         （那边有同主题注释）；public/scrolly/index.html 是另一份清单，别照抄主站这条。 -->
    <link rel="preconnect" href="https://fonts.googleapis.cn" />
    <link rel="preconnect" href="https://fonts.gstatic.cn" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.cn/css2?family=DM+Mono:wght@400;500&family=Archivo:ital,wght@0,300;0,500;0,600;0,700;0,800;1,800&display=swap"
    />

    <!-- 基础 SEO -->
    <title>李纵横 · 个人作品集 | AI 内容运营与视觉创作者</title>
    <meta
      name="description"
      content="李纵横的个人作品集：专注内容、运营与现场执行的交界处，让创意转化为可见的影响力。涵盖虎扑 CSGO 上海 Major、WaytoAGI 少儿 AI 春晚、弥勒春晚、芒果TV《大侦探》等项目。"
    />
    <meta name="author" content="李纵横" />
    <meta name="keywords" content="李纵横,作品集,内容运营,AI内容,视觉创作,短视频,活动策划,个人主页" />
    <link rel="canonical" href="https://lizongheng-ktftxw0cmi4.qoder.zone/" />

    <!-- Open Graph（微信 / 朋友圈 / 社交媒体分享卡片） -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:site_name" content="李纵横 · 个人作品集" />
    <meta property="og:title" content="李纵横 · 个人作品集 | AI 内容运营与视觉创作者" />
    <meta
      property="og:description"
      content="专注内容、运营与现场执行的交界处，让创意转化为可见的影响力。"
    />
    <!-- 分享封面：`public/assets/og-cover.jpg`（1200×630，与首屏同一套白板语言）。
         写成绝对 URL：微信/QQ/微博的爬虫会拿页面 origin 补全根相对路径，
         但 Twitter / Slack / LinkedIn 的爬虫要求绝对 URL，根相对的抓不到图。
         换域名时，这一行和 canonical / og:url、public/robots.txt 的 Sitemap 行、
         public/sitemap.xml 的 <loc> 一起换（共六处），不同步会被搜索引擎当成两个站点。 -->
    <meta property="og:image" content="https://lizongheng-ktftxw0cmi4.qoder.zone/assets/og-cover.jpg" />
    <meta property="og:url" content="https://lizongheng-ktftxw0cmi4.qoder.zone/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="李纵横 · 个人作品集 | AI 内容运营与视觉创作者" />
    <meta
      name="twitter:description"
      content="专注内容、运营与现场执行的交界处，让创意转化为可见的影响力。"
    />
    <meta name="twitter:image" content="https://lizongheng-ktftxw0cmi4.qoder.zone/assets/og-cover.jpg" />

    <!-- favicon（本地 SVG，避免外链失效） -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- apple-touch-icon 必须位图：iOS「添加到主屏幕」不解析 SVG，
         没有它就是整页实时截图当图标（求职方用 iPhone 收藏链接时会看到）。
         由 public/favicon.svg 同一份构图渲染而来（值抄 global.css 的 void-1 /
         text-bright / rim-ember），改字标时两边同步。 -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
