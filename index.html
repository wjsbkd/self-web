<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- theme-color 与页面最深档 --void-7 同值：手机浏览器的地址栏色应当是
         页面尽头的那个黑，不是改造前的暖炭 #0d0a0c -->
    <meta name="theme-color" content="#020202" />
    <style>
      /* 预绘制底色：CSS bundle 到位前先垫一层，避免首帧闪白 */
      html {
        background: #020202;
        color-scheme: dark;
      }
    </style>

    <!-- 基础 SEO -->
    <title>李纵横 · 个人作品集 | AI 内容运营与视觉创作者</title>
    <meta
      name="description"
      content="李纵横的个人作品集：专注内容、运营与现场执行的交界处，让创意转化为可见的影响力。涵盖虎扑 CSGO 上海 Major、抖音小火人世界、弥勒春晚、芒果TV《大侦探》等项目。"
    />
    <meta name="author" content="李纵横" />
    <meta name="keywords" content="李纵横,作品集,内容运营,AI内容,视觉创作,短视频,活动策划,个人主页" />
    <link rel="canonical" href="https://lizongheng.example.com/" />

    <!-- Open Graph（微信 / 朋友圈 / 社交媒体分享卡片） -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:site_name" content="李纵横 · 个人作品集" />
    <meta property="og:title" content="李纵横 · 个人作品集 | AI 内容运营与视觉创作者" />
    <meta
      property="og:description"
      content="专注内容、运营与现场执行的交界处，让创意转化为可见的影响力。"
    />
    <!-- 分享封面：部署后替换为一张 1200×630 的本站品牌图，例如 /assets/og-cover.jpg -->
    <meta
      property="og:image"
      content="https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1200&q=80"
    />
    <meta property="og:url" content="https://lizongheng.example.com/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="李纵横 · 个人作品集 | AI 内容运营与视觉创作者" />
    <meta
      name="twitter:description"
      content="专注内容、运营与现场执行的交界处，让创意转化为可见的影响力。"
    />
    <meta
      name="twitter:image"
      content="https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1200&q=80"
    />

    <!-- favicon（本地 SVG，避免外链失效） -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
